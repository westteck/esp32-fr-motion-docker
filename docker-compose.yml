# ESP32-CAM AI system.
#
# Copy .env.example to .env and set CAM_TOKEN / ADMIN_TOKEN before starting;
# the PHP endpoints fail closed (HTTP 500) while they are unset.
#
# Fixed here:
#   * The face database was split across two host directories: manage_faces.php
#     wrote to <data>/uploads/known_faces while the brain read <data>/known_faces,
#     so uploaded faces never reached the recogniser and every face was
#     "Unknown". Both containers now share one data root.
#   * The brain no longer installs its dependencies at runtime (see
#     Dockerfile.brain).
#   * The obsolete top-level `version:` key is gone.

services:
  web:
    image: php:8.3-fpm-alpine
    container_name: esp32-php
    env_file: [.env]
    environment:
      DATA_ROOT: /var/www/data
    volumes:
      - ./server/public:/var/www/html:ro
      - ${DATA_DIR:-./data}:/var/www/data
      - ./docker/php-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    # Ensure the shared data tree exists and is writable by the FPM workers
    # before accepting requests.
    command: >
      sh -c "mkdir -p /var/www/data/uploads /var/www/data/known_faces /var/www/data/state
      && chown -R www-data:www-data /var/www/data
      && chmod 750 /var/www/data /var/www/data/uploads /var/www/data/known_faces /var/www/data/state
      && exec php-fpm"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: esp32-nginx
    ports:
      # Bound to the LAN interface only by default. Do not port-forward this
      # without putting TLS in front of it; frames and tokens are plaintext.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8787}:80"
    volumes:
      - ./server/public:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    image: esp32-brain:local
    container_name: esp32-brain
    env_file: [.env]
    environment:
      DATA_ROOT: /app/data
      RCLONE_CONFIG: /config/rclone.conf
    volumes:
      # Same host directory as the web container: this is what makes the face
      # database and the command queue actually shared.
      - ${DATA_DIR:-./data}:/app/data
      - ./rclone.conf:/config/rclone.conf:ro
    restart: unless-stopped
    healthcheck:
      # The brain writes a heartbeat into its status file each cycle.
      test: ["CMD-SHELL", "python3 -c \"import json,time,sys; s=json.load(open('/app/data/state/brain_status.json')); sys.exit(0 if time.time()-s['heartbeat'] < 120 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
