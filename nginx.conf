server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Frames are capped at 512 KiB and face photos at 4 MiB by the application;
    # the default 1 MiB here would have rejected face uploads outright.
    client_max_body_size 6m;
    client_body_timeout 30s;

    # The data directory (uploads, known_faces, state) lives at /var/www/data,
    # outside this root, and is reachable only through frame.php / face.php.
    # That is what stops a stored file from ever being served or executed.

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # try_files + split_path_info closes the classic nginx/PHP path-info
        # hole, where a request for /frame.jpg/x.php would be handed to PHP and
        # an uploaded image executed as code. The original config had neither.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass web:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    # The shared PHP library is included by the endpoints, never requested.
    location ^~ /lib/ {
        deny all;
    }

    # Dotfiles, editor leftovers, and anything that is not meant to be public.
    location ~ /\. {
        deny all;
    }
    location ~ ~$ {
        deny all;
    }
}
