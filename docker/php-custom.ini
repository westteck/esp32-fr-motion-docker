; Hardening and limits for the PHP container.

; Frames are capped at 512 KiB by upload.php; face photos at 4 MiB. Give a
; little headroom for multipart overhead but no more.
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 2
memory_limit = 64M
max_execution_time = 30

; Confine filesystem access to the document root and the data directory.
open_basedir = /var/www/html:/var/www/data:/tmp

; Never leak stack traces or paths to a client.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

; Nothing in this project shells out.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

session.cookie_httponly = On
session.cookie_samesite = Strict
session.use_strict_mode = On
